name: Build OpenWrt Firmware

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启 SSH 接入进行 menuconfig 调整'
        required: false
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss                          # <-- 必须指定 25.12-nss 分支
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: arthur.config                       # 确保你仓库根目录下有该 config 文件
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查代码仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -o Acquire::http::Timeout="30" -o Acquire::Retries="3" update
        sudo -E apt-get install -y --no-install-recommends \
          -o Acquire::http::Timeout="30" -o Acquire::Retries="3" \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
          gcc-multilib g++-multilib git haveged intltool lib32gcc-s1 libc6-dev-i386 \
          libglib2.0-dev libgmp3-dev libpostproc-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          msmtp nano ninja-build pnetcdf-bin python3 python3-pip python3-ply \
          python3-docutils python3-pyelftools qemu-utils rsync subversion texinfo \
          u-boot-tools unzip xmlto xz-utils zlib1g-dev zstd
        sudo -E apt-get autoremove --purge
        sudo -E apt-get clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆 LibWrt 源码
      working-directory: /workdir
      run: |
        git clone -b $REPO_BRANCH --depth 1 $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存 OpenWrt 编译依赖 (dl & ccache)
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain
        key: ${{ runner.os }}-openwrt-${{ hashFiles('openwrt/feeds.conf.default') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-openwrt-${{ hashFiles('openwrt/feeds.conf.default') }}-
          ${{ runner.os }}-openwrt-

    - name: 加载 DIY-1 脚本 (添加 Feeds)
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/
        [ -e $DIY_P1_SH ] && chmod +x $DIY_P1_SH && ./$DIY_P1_SH || true

    - name: 更新并安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载 DIY-2 脚本与 Config 选项
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        [ -e $DIY_P2_SH ] && chmod +x $DIY_P2_SH && ./$DIY_P2_SH || true
        cd openwrt
        make defconfig

    - name: 开启 SSH 终端进行 menuconfig 配置
      uses: P3TERX/ssh2actions@main
      if: (github.event.inputs.ssh == 'true' || github.event.inputs.ssh == 'true') && !cancelled()
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载源码依赖包 (Make Download)
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -rf {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1 || make -j1 V=s FORCE_UNSAFE_CONFIGURE=1
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 整理编译产物
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件至 Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_ARTIFACT == 'true' && !cancelled()
      with:
        name: Lean_OpenWrt_${{ github.run_id }}
        path: ${{ env.FIRMWARE }}

    - name: 发布至 GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        tag_name: Lean_OpenWrt_${{ github.run_id }}
        files: ${{ env.FIRMWARE }}/*
        token: ${{ secrets.GITHUB_TOKEN }}
